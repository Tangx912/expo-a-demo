 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);

 const platform=new THREE.Mesh(new THREE.BoxGeometry(80,.6,64),new THREE.MeshStandardMaterial({color:'#d9dbd2',roughness:.9}));platform.position.y=-.1;platform.receiveShadow=true;scene.add(platform);
 const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,1000);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-2,32,0);controls.enableDamping=true;controls.minDistance=95;controls.maxDistance=350;controls.maxPolarAngle=Math.PI/2-.03;
 function reset(){const mobile=innerWidth<600;camera.position.set(-108,mobile?95:88,mobile?200:162);controls.target.set(-2,32,0);controls.update();}reset();document.querySelector('#reset').onclick=reset;
 window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
